// =============================================================================
// baedalsak-server 루트 빌드 스크립트
//
// 역할: 6개 서비스 모듈의 "공통 설정"만 둔다.
//      모듈별 build.gradle에는 그 서비스에만 필요한 의존성
//      (JPA·Flyway·RabbitMQ, 세션 Redis, Spring Cloud Gateway 등)만 적는다.
//
// 관련 규칙: docs/backend-infra-rules.md
//      1번 저장소 구조 · 2번 필수 의존성 · 8번 체크리스트 · 9-2 관측성(후순위)
// =============================================================================

plugins {
    // apply false = 루트에는 적용하지 않고 "버전만" 고정한다.
    // 루트에 Spring Boot 플러그인을 적용하면 main 클래스가 없어 bootJar가 실패한다. (docs 1번)
    id 'org.springframework.boot' version '4.0.8' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

// Spring Cloud 릴리스 트레인 (gateway의 Spring Cloud Gateway용).
// Spring Boot 4.0.x ↔ Spring Cloud 2025.1.x 로 짝이 맞아야 한다. (docs 2번)
// (2026.0 은 Boot 4.1용이므로 Boot 를 올리기 전에는 올리지 말 것)
ext {
    springCloudVersion = '2025.1.3'
}

// docs 1번: Spring Boot 플러그인은 "실행할 서비스 모듈에만" 적용한다.
// 나중에 common 모듈을 추가하면 이 목록에는 넣지 않는다 (java-library로 둔다).
def serviceModules = [
        'gateway',
        'store',
        'order',
        'payment',
        'delivery',
        'member',
]

allprojects {
    group = 'com.baedalsak'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

// ---------- 모든 모듈 공통 (common 모듈이 생겨도 여기까지는 적용된다) ----------
subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    // Dockerfile의 ARG JAVA_VERSION=21 과 맞춘다.
    // toolchain을 쓰면 로컬에 깔린 JDK 버전이 달라도 Gradle이 21을 찾아 쓴다.
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    // 버전을 BOM에서 받아오므로 모듈에서는 의존성 버전을 적지 않는다. (docs 2번)
    dependencyManagement {
        imports {
            // Spring Boot BOM. 위 plugins 블록의 4.0.8이 그대로 쓰여 버전이 한 곳에만 있다.
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

// ---------- 실행 가능한 서비스 모듈만 ----------
configure(subprojects.findAll { it.name in serviceModules }) {
    apply plugin: 'org.springframework.boot'

    dependencies {
        // docs 2번: 모든 서비스 모듈에 필수
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        // 분산 추적: traceId 를 HTTP·RabbitMQ 헤더로 전파하고 로그에 출력 (docs 6-2)
        implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
        implementation 'io.micrometer:micrometer-tracing-bridge-brave'
        // 후순위 (관측성) — 쓸 때 주석 해제 (docs 9-2)
        // implementation 'org.springframework.boot:spring-boot-starter-zipkin'   // Zipkin 전송 (위 2줄 대신)
        // runtimeOnly    'io.micrometer:micrometer-registry-prometheus'          // /actuator/prometheus

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    // docs 1번: "서비스 모듈 하나는 실행용 jar 하나만 만든다"
    // 끄지 않으면 build/libs에 *-plain.jar가 함께 생긴다.
    // (Dockerfile이 *-plain.jar를 걸러내긴 하지만, 애초에 안 만드는 쪽이 안전하다)
    tasks.named('jar') {
        enabled = false
    }
}
