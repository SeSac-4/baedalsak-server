<body style="margin:0;padding:0;">
<div style="margin:0;padding:24px 12px;background:#f6f7f9;"><div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e5e8eb;border-radius:12px;padding:24px 20px;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#191f28;font-size:15px;line-height:1.6;"><div style="font-weight:800;color:#2f6fed;margin:0 0 12px;">배달싹 사장님</div><h1 style="margin:0 0 8px;font-size:20px;">새 주문이 들어왔어요</h1><p style="margin:0 0 16px;">{{storeName}}에 결제가 완료된 새 주문이 들어왔어요. 주문을 확인하고 수락해 주세요.</p><table role="presentation" style="width:100%;border:1px solid #e5e8eb;border-radius:10px;border-collapse:separate;padding:10px 14px;margin:0 0 16px;font-size:14px;"><tr><td style="padding:4px 12px 4px 0;color:#6b7684;white-space:nowrap;">주문번호</td><td style="padding:4px 0;">{{orderId}}</td></tr><tr><td style="padding:4px 12px 4px 0;color:#6b7684;white-space:nowrap;">결제 금액</td><td style="padding:4px 0;">{{amount}}</td></tr><tr><td style="padding:4px 12px 4px 0;color:#6b7684;white-space:nowrap;">승인 시각</td><td style="padding:4px 0;">{{approvedAt}}</td></tr></table><p style="margin:0 0 16px;">신규 주문은 사장님 화면의 가게 주문 목록에서 확인할 수 있어요.</p><p style="margin:16px 0 0;padding-top:12px;border-top:1px solid #e5e8eb;color:#6b7684;font-size:12px;">이 메일은 발신 전용입니다.</p></div></div>
</body>
