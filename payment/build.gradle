// 루트 build.gradle이 Java 21 / Spring Boot BOM / actuator / tracing-brave /
// lombok 을 이미 넣어 준다 (docs 2번). 여기에는 이 서비스에만 필요한 것만 적는다.
dependencies {
    implementation project(':common')                                         // 공통 에러 응답·예외 처리·로그인 사용자 헤더
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'      // Boot 4 이름 (구 starter-web)
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'      // Boot 4: Flyway 자동 실행에 필요 (docs 4-1)
    implementation 'org.flywaydb:flyway-database-postgresql'                  // Flyway 10+ 는 DB별 모듈 필요
    implementation 'org.springframework.boot:spring-boot-starter-amqp'        // RabbitMQ (docs 3-1)
    // [내부] 동기 호출 클라이언트 (order). Boot 가 만든 RestClient.Builder 를 써야 traceId 가 HTTP 헤더로 전파됨 (docs 6-2)
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    // AWS SDK v2 — SES 결제완료 메일 (#37). member 와 같은 BOM 버전. 자격 증명은 코드에 두지 않음
    //   로컬: local 프로필은 발송 대신 로그만 / AWS: Pod Identity (기본 자격 증명 체인이 알아서 찾음)
    implementation platform('software.amazon.awssdk:bom:2.57.3')
    implementation 'software.amazon.awssdk:sesv2'

    runtimeOnly 'org.postgresql:postgresql'
}
