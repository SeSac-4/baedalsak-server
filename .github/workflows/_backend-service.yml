# =============================================================================
# 서비스 1개의 CI (재사용 워크플로) — backend-ci.yml 에서 서비스마다 호출
#
#   test     : ./gradlew :<모듈>:test
#   image    : 아키텍처별 네이티브 러너에서 이미지 빌드 → Trivy 검사 → (push 시) digest 로 push
#                PR   : amd64 만
#                main : amd64 (ubuntu-24.04) + arm64 (ubuntu-24.04-arm)
#   manifest : (push 시) 두 아키텍처를 하나의 태그로 묶음 → sha-<7자리>, main
#
#   Trivy : CRITICAL 이 있으면 실패 / 전체 결과는 Security 탭(Code scanning)에 업로드
# =============================================================================
name: backend-service

on:
  workflow_call:
    inputs:
      service:
        description: 서비스 이름 (gateway, store, ...)
        type: string
        required: true
      module:
        description: Gradle 모듈 폴더 경로 (Dockerfile 의 MODULE 인자)
        type: string
        required: true
      push:
        description: true 면 GHCR 에 push
        type: boolean
        default: false

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  TRIVY_VERSION: v0.70.0     # trivy-action v0.36.0 기본값과 동일하게 고정

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: 테스트
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: 테스트 실행
        env:
          MODULE: ${{ inputs.module }}
        run: |
          chmod +x gradlew
          ./gradlew ":${MODULE//\//:}:test" --no-daemon

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ inputs.service }}
          path: ${{ inputs.module }}/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  image:
    name: 이미지 (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.push && '["amd64","arm64"]' || '["amd64"]') }}
    # QEMU 에뮬레이션 대신 아키텍처별 네이티브 러너 사용 (Gradle 빌드가 훨씬 빠름)
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 이미지 이름 설정 (owner 소문자)
        env:
          SERVICE: ${{ inputs.service }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/baedalsak/${SERVICE}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: OCI 라벨 생성 (GHCR 패키지 ↔ 저장소 연결)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      # 1) 검사용 빌드: 러너의 Docker 에 로드
      - name: 이미지 빌드 (검사용)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          build-args: MODULE=${{ inputs.module }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: local/${{ inputs.service }}:scan
          load: true
          cache-from: type=gha,scope=${{ inputs.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}-${{ matrix.arch }}

      # 2) 전체 결과 → SARIF (실패시키지 않음)
      - name: Trivy 검사 (전체 → Security 탭)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: local/${{ inputs.service }}:scan
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Trivy 결과 업로드 (Security 탭)
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ inputs.service }}-${{ matrix.arch }}

      # 3) 게이트: CRITICAL 이 있으면 여기서 실패 → push 하지 않음
      - name: Trivy 검사 (CRITICAL 이면 실패)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: local/${{ inputs.service }}:scan
          severity: CRITICAL
          format: table
          output: trivy-critical.txt
          exit-code: "1"
          skip-setup-trivy: true   # 위 단계에서 설치한 Trivy 재사용

      - name: Trivy 요약 (실행 요약 화면)
        if: always() && hashFiles('trivy-critical.txt') != ''
        env:
          SERVICE: ${{ inputs.service }}
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "### Trivy CRITICAL — ${SERVICE} (${ARCH})"
            echo '```'
            cat trivy-critical.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 4) push: 같은 빌드를 캐시로 재사용해 digest 로만 push (태그는 manifest job 에서)
      - name: GHCR 로그인
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 push (digest)
        if: inputs.push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          build-args: MODULE=${{ inputs.module }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.service }}-${{ matrix.arch }}

      - name: digest 저장
        if: inputs.push
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: digest 업로드
        if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ inputs.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  manifest:
    name: 태그 생성 (amd64 + arm64)
    needs: image
    if: inputs.push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: 이미지 이름 설정 (owner 소문자)
        env:
          SERVICE: ${{ inputs.service }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/baedalsak/${SERVICE}" >> "$GITHUB_ENV"

      - name: digest 내려받기
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.service }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: GHCR 로그인
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 태그 계산 (sha-<7자리>, main)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main

      - name: 멀티 아키텍처 태그 생성
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: 결과 확인
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          {
            echo "### push 완료: \`${IMAGE}\`"
            jq -r '.tags[] | "- `" + . + "`"' <<< "$DOCKER_METADATA_OUTPUT_JSON"
          } >> "$GITHUB_STEP_SUMMARY"
