# =============================================================================
# 서비스 1개의 CI (재사용 워크플로) — backend-ci.yml 에서 서비스마다 호출
#
#   test     : ./gradlew :<모듈>:test
#   image    : 이미지 빌드(amd64) → Trivy 검사 (push 없음 — 배포 이미지는 baedalsak-infra 가 ECR 에 빌드)
#
#   Trivy : CRITICAL 이 있으면 실패 / 전체 결과는 Security 탭(Code scanning)에 업로드
# =============================================================================
name: backend-service

on:
  workflow_call:
    inputs:
      service:
        description: 서비스 이름 (gateway, store, ...)
        type: string
        required: true
      module:
        description: Gradle 모듈 폴더 경로 (Dockerfile 의 MODULE 인자)
        type: string
        required: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  TRIVY_VERSION: v0.70.0     # trivy-action v0.36.0 기본값과 동일하게 고정

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: 테스트
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: 테스트 실행
        env:
          MODULE: ${{ inputs.module }}
        run: |
          chmod +x gradlew
          ./gradlew ":${MODULE//\//:}:test" --no-daemon

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ inputs.service }}
          path: ${{ inputs.module }}/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  image:
    name: 이미지 (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 1) 검사용 빌드: 러너의 Docker 에 로드
      - name: 이미지 빌드 (검사용)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          build-args: MODULE=${{ inputs.module }}
          platforms: linux/${{ matrix.arch }}
          tags: local/${{ inputs.service }}:scan
          load: true
          cache-from: type=gha,scope=${{ inputs.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}-${{ matrix.arch }}

      # 2) 전체 결과 → SARIF (실패시키지 않음)
      - name: Trivy 검사 (전체 → Security 탭)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: local/${{ inputs.service }}:scan
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Trivy 결과 업로드 (Security 탭)
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ inputs.service }}-${{ matrix.arch }}

      # 3) 게이트: CRITICAL 이 있으면 여기서 실패
      - name: Trivy 검사 (CRITICAL 이면 실패)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: local/${{ inputs.service }}:scan
          severity: CRITICAL
          format: table
          output: trivy-critical.txt
          exit-code: "1"
          skip-setup-trivy: true   # 위 단계에서 설치한 Trivy 재사용

      - name: Trivy 요약 (실행 요약 화면)
        if: always() && hashFiles('trivy-critical.txt') != ''
        env:
          SERVICE: ${{ inputs.service }}
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "### Trivy CRITICAL — ${SERVICE} (${ARCH})"
            echo '```'
            cat trivy-critical.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

