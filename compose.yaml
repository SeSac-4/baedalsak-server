# =============================================================================
# baedalsak-server 로컬 개발 환경
#
#   준비:   cp .env.example .env
#
#   의존성만 실행 (기본, VSCode에서 서비스를 직접 실행할 때)
#     docker compose up -d
#
#   서비스까지 전부 컨테이너로 실행 (통합 확인용, 서비스 6개)
#     docker compose --profile apps up -d --build
#
#   서비스 하나만 다시 빌드·실행
#     docker compose --profile apps up -d --build store
#
#   정리 (DB 데이터까지 지우려면 -v)
#     docker compose --profile apps down
#
# 운영(v6) 대응: RDS PostgreSQL(인스턴스 1개 · 서비스별 DB 5개) / Amazon MQ for RabbitMQ 4.2 / ElastiCache(세션·토큰)
# DynamoDB 는 주석 처리 (사용처 없음), Zipkin·Prometheus·Grafana·Fluent Bit 은 후순위 — 목록: docs/backend-infra-rules.md 9번
# =============================================================================

name: baedalsak-local

# ---------- 서비스 공통 설정 ----------
x-app: &app
  profiles: ["apps"]
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    # dynamodb: { condition: service_started }        # DynamoDB 주석 처리
    redis-session: { condition: service_healthy }
    # redis-cache: { condition: service_healthy }      # DB 캐시용 Redis 보류

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: local
  SERVER_PORT: "8080"                       # 컨테이너 안에서는 모두 8080
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_PASSWORD: ${DB_PASSWORD:?.env 파일을 만들어 주세요}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:?.env 파일을 만들어 주세요}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?.env 파일을 만들어 주세요}
  RABBITMQ_VHOST: /                         # 운영 Amazon MQ: /prod · /dev
  RABBITMQ_SSL_ENABLED: "false"             # 운영 Amazon MQ: true (AMQPS 5671)
  # 개발용 seed 계정 (db/seed/R__<서비스>_seed.sql, #73). 운영에는 두지 않음
  SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
  # DynamoDB 주석 처리
  # DYNAMODB_ENDPOINT: http://dynamodb:8000
  # AWS_ACCESS_KEY_ID: local                # DynamoDB Local은 아무 값이나 받음
  # AWS_SECRET_ACCESS_KEY: local
  AWS_REGION: ap-northeast-2                # SES 등 AWS SDK 리전
  TZ: Asia/Seoul                            # KST
  # 후순위 (관측성): 분산 추적 → Zipkin (http://localhost:9411)
  # ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  # 세션·토큰 Redis (gateway·member가 사용)
  REDIS_SESSION_HOST: redis-session
  REDIS_SESSION_PORT: "6379"                # 컨테이너끼리는 둘 다 6379
  REDIS_SESSION_PASSWORD: ${REDIS_SESSION_PASSWORD:?.env 파일을 만들어 주세요}
  # DB 캐시용 Redis — 보류 (도입 시 주석 해제)
  # REDIS_CACHE_HOST: redis-cache
  # REDIS_CACHE_PORT: "6379"
  # REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD:?.env 파일을 만들어 주세요}

services:
  # =========================== 의존성 ===========================
  postgres:
    image: postgres:16-alpine               # RDS 엔진 메이저 버전과 맞출 것
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ${DB_NAME:-baedalsak}    # 관리자 기본 DB. 서비스 DB 5개는 초기화 스크립트가 생성
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?.env 파일을 만들어 주세요}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?.env 파일을 만들어 주세요}
      SERVICE_DB_PASSWORD: ${DB_PASSWORD:?.env 파일을 만들어 주세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 서비스별 DB·schema·계정 생성 (볼륨이 비어 있을 때 한 번만 실행)
      - ./docker/local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.2-management          # 운영 Amazon MQ for RabbitMQ 의 권장 엔진 버전(4.2)과 맞춤
    ports:
      - "5672:5672"
      - "15672:15672"                       # 관리 화면 http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?.env 파일을 만들어 주세요}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?.env 파일을 만들어 주세요}
    volumes:
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------- DynamoDB Local — 주석 처리 (사용처 없음. 필요해지면 주석 해제) ----------
  # dynamodb:
  #   image: amazon/dynamodb-local:latest   # 로컬 에뮬레이터라 latest 태그 금지 규칙의 예외
  #   ports: ["8000:8000"]
  #   command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
  #   user: root                            # 볼륨 쓰기 권한
  #   volumes:
  #     - ddbdata:/home/dynamodblocal/data

  # ---------- Zipkin — 분산 추적 화면 (N5.2) — 후순위 (관측성), 주석 처리 ----------
  # 브라우저 http://localhost:9411 → traceId 로 gateway → 서비스 → RabbitMQ 흐름 조회 (메모리 저장, 재시작 시 초기화)
  # zipkin:
  #   image: openzipkin/zipkin:3.6.1
  #   ports: ["9411:9411"]

  # ---------- Redis ① 세션·토큰 관리용 (운영: ElastiCache 세션 전용, ALB 단계에서 토큰 관리) ----------
  # 세션은 지워지면 사용자가 로그아웃되므로, 메모리가 차도 키를 지우지 않음(noeviction)
  redis-session:
    image: redis:7-alpine                   # ElastiCache 엔진 버전과 맞출 것
    ports: ["6379:6379"]                    # 로컬 PC에서 접속할 때만 포트 구분 필요
    environment:
      REDISCLI_AUTH: ${REDIS_SESSION_PASSWORD:?.env 파일을 만들어 주세요}   # healthcheck용
    command:
      - redis-server
      - --requirepass
      - ${REDIS_SESSION_PASSWORD:?.env 파일을 만들어 주세요}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- Redis ② DB 캐시용 — 보류 (도입 시 주석 해제) ----------
  # 고객·메뉴·가게처럼 잘 안 바뀌는 조회 결과 캐시. 지워져도 DB에서 다시 읽으면 되므로 allkeys-lru
  # redis-cache:
  #   image: redis:7-alpine
  #   ports: ["6380:6379"]                  # 로컬 PC에서는 6380, 컨테이너 안에서는 6379
  #   environment:
  #     REDISCLI_AUTH: ${REDIS_CACHE_PASSWORD:?.env 파일을 만들어 주세요}
  #   command:
  #     - redis-server
  #     - --requirepass
  #     - ${REDIS_CACHE_PASSWORD:?.env 파일을 만들어 주세요}
  #     - --maxmemory
  #     - 256mb
  #     - --maxmemory-policy
  #     - allkeys-lru
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 20

  # =================== 서비스 (profile: apps) ===================
  # 저장소 루트의 Dockerfile로 직접 빌드. 모듈 폴더 경로는 .env의 *_MODULE로 바꿀 수 있음
  # Ingress (API 진입점)
  gateway:
    <<: *app
    build: { context: ., args: { MODULE: "${GATEWAY_MODULE:-gateway}" } }
    image: baedalsak/gateway:local
    ports: ["8080:8080"]
    environment:
      <<: *app-env
      # 컨테이너끼리는 서비스 이름으로 호출
      STORE_SERVICE_URL: http://store:8080
      ORDER_SERVICE_URL: http://order:8080
      PAYMENT_SERVICE_URL: http://payment:8080
      DELIVERY_SERVICE_URL: http://delivery:8080
      MEMBER_SERVICE_URL: http://member:8080

  # 메뉴·가게
  store:
    <<: *app
    build: { context: ., args: { MODULE: "${STORE_MODULE:-store}" } }
    image: baedalsak/store:local
    ports: ["8081:8080"]
    environment: { <<: *app-env, DB_NAME: store, DB_USER: store_svc, DB_SCHEMA: store }

  # 주문·장바구니
  order:
    <<: *app
    build: { context: ., args: { MODULE: "${ORDER_MODULE:-order}" } }
    image: baedalsak/order:local
    ports: ["8082:8080"]
    environment:
      <<: *app-env
      DB_NAME: orders
      DB_USER: order_svc
      DB_SCHEMA: orders
      # [내부] 동기 호출 (설계서 '동기 호출' 탭)
      STORE_SERVICE_URL: http://store:8080
      MEMBER_SERVICE_URL: http://member:8080

  # 결제
  payment:
    <<: *app
    build: { context: ., args: { MODULE: "${PAYMENT_MODULE:-payment}" } }
    image: baedalsak/payment:local
    ports: ["8083:8080"]
    environment:
      <<: *app-env
      DB_NAME: payment
      DB_USER: payment_svc
      DB_SCHEMA: payment
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:?.env 파일에 TOSS_SECRET_KEY 를 추가해 주세요}   # 토스 결제 승인

  # 배달
  delivery:
    <<: *app
    build: { context: ., args: { MODULE: "${DELIVERY_MODULE:-delivery}" } }
    image: baedalsak/delivery:local
    ports: ["8084:8080"]
    environment:
      <<: *app-env
      DB_NAME: delivery
      DB_USER: delivery_svc
      DB_SCHEMA: delivery
      MEMBER_SERVICE_URL: http://member:8080   # [내부] 배차 수락 시 라이더 이름

  # 인증·인가
  member:
    <<: *app
    build: { context: ., args: { MODULE: "${MEMBER_MODULE:-member}" } }
    image: baedalsak/member:local
    ports: ["8085:8080"]
    environment:
      <<: *app-env
      DB_NAME: member
      DB_USER: member_svc
      DB_SCHEMA: member
      # Cognito 로컬 풀 (#18). 컨테이너 안에서 Cognito 를 실제로 부르려면 AWS 자격 증명도 필요
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?.env 파일에 COGNITO_USER_POOL_ID 를 추가해 주세요}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?.env 파일에 COGNITO_CLIENT_ID 를 추가해 주세요}

volumes:
  pgdata:
  mqdata:
  # ddbdata:                                # DynamoDB 주석 처리
