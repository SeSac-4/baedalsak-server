# gateway 서비스 (CloudFront → internal ALB 뒤 API 진입점, 설계서 v3)
# 환경 변수 이름은 docs/backend-infra-rules.md 3번 표를 그대로 쓴다.
# 로컬 .env -> Kubernetes Secret -> AWS Secrets Manager 까지 이 이름이 이어지므로 바꾸지 말 것.
#
# gateway는 DB·RabbitMQ를 직접 보지 않는다.
# 토큰 검증은 Cognito 공개키(JWKS)로 한다 — 비밀 키(JWT_SECRET)는 쓰지 않음 (#23 에서 COGNITO_* 연결)

server:
  port: ${SERVER_PORT:8080}           # docs 1번 표. 컨테이너 안에서도 8080
  shutdown: graceful                  # 배포 중 처리 중인 요청을 끝내고 종료 (docs 6-4)

spring:
  application:
    name: gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  reactor:
    context-propagation: auto         # WebFlux 에서 로그에 traceId 가 찍히게 함 (docs 6-2)
  jackson:
    time-zone: Asia/Seoul             # API 응답 시각 KST (+09:00)

  # docs 5번: 세션·토큰 Redis (gateway·member만 사용)
  data:
    redis:
      host: ${REDIS_SESSION_HOST:localhost}
      port: ${REDIS_SESSION_PORT:6379}
      password: ${REDIS_SESSION_PASSWORD}

  cloud:
    gateway:
      # Spring Cloud Gateway 4.3+ 설정 경로 (구 spring.cloud.gateway.routes 는 deprecated)
      server:
        webflux:
          # docs 7번 gateway 라우팅
          #   설계서 v3: /api 는 gateway 가 뗀다 (ALB·CloudFront 는 경로를 바꾸지 않고 전달)
          #   /api/v1/stores 로 받아 → 아래 StripPrefix=1 로 /v1/stores 로 넘긴다
          #   /v*/ 는 버전 숫자와 무관하게 매칭 → v2 가 생겨도 gateway 는 그대로
          #   order 값이 작은 라우트부터 먼저 맞는 것 하나로 간다
          #   /internal/** 는 라우트 없음 → 404 (서비스 간 직접 호출 전용)
          # uri 는 docs 3번 표의 *_SERVICE_URL 로만 받는다 (compose: http://store:8080 등)
          # 기본값은 로컬 VSCode 실행용 포트 (docs 1번 표)
          default-filters:
            - StripPrefix=1           # 모든 라우트 공통: 앞의 /api 한 단계를 떼고 하위 서비스로 전달
          routes:
            # 사장님 가게 주문 목록 — store 보다 먼저 매칭되어야 함
            - id: order-store-orders
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              order: 1
              predicates:
                - Path=/api/v*/stores/*/orders/**

            - id: store
              uri: ${STORE_SERVICE_URL:http://localhost:8081}
              order: 2
              predicates:
                - Path=/api/v*/stores/**,/api/v*/categories/**

            - id: order
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              order: 3
              predicates:
                - Path=/api/v*/orders/**,/api/v*/cart/**

            - id: payment
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
              order: 4
              predicates:
                - Path=/api/v*/payments/**

            - id: delivery
              uri: ${DELIVERY_SERVICE_URL:http://localhost:8084}
              order: 5
              predicates:
                - Path=/api/v*/deliveries/**

            - id: member
              uri: ${MEMBER_SERVICE_URL:http://localhost:8085}
              order: 6
              predicates:
                - Path=/api/v*/auth/**,/api/v*/members/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # prometheus: Grafana 지표 (#91). AWS 는 8081(비공개)에서만
  endpoint:
    health:
      probes:
        enabled: true                 # /actuator/health/liveness, /readiness 활성화
  tracing:
    sampling:
      probability: 1.0                # gateway 가 traceId 를 만들어 하위 서비스로 전파 (docs 6-2)
    # 후순위 (관측성): Zipkin 전송 — starter-zipkin 과 함께 주석 해제 (docs 9-2)
    # export:
    #   zipkin:
    #     endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
    # 관측성 (#91, 인프라 문서 2026-10-28)
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true      # HTTP 응답 시간 p95 계산용 bucket
        spring.cloud.gateway.requests: true   # 라우트별 응답 시간 p95
  otlp:
    metrics:
      export:
        enabled: false                  # 지표는 Prometheus 가 수집 — OTLP 중복 전송 끔
  logging:
    export:
      otlp:
        enabled: false                  # 로그는 stdout → Fluent Bit → Loki — OTLP 중복 전송 끔

logging:
  structured:
    format:
      console: logstash               # JSON 로그 (docs 6-1)
