# gateway 서비스 (Ingress 뒤 API 진입점)
# 환경 변수 이름은 docs/backend-infra-rules.md 3번 표를 그대로 쓴다.
# 로컬 .env -> Kubernetes Secret -> AWS Secrets Manager 까지 이 이름이 이어지므로 바꾸지 말 것.
#
# gateway는 DB·RabbitMQ를 직접 보지 않는다.
# 비밀값 (docs 3번 🔒) — 기본값 없이 환경 변수로만 받는다
#   JWT_SECRET: 토큰 서명 검증 키 (32바이트 이상)

server:
  port: ${SERVER_PORT:8080}           # docs 1번 표. 컨테이너 안에서도 8080
  shutdown: graceful                  # 배포 중 처리 중인 요청을 끝내고 종료 (docs 6-4)

spring:
  application:
    name: gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  reactor:
    context-propagation: auto         # WebFlux 에서 로그에 traceId 가 찍히게 함 (docs 6-2)
  jackson:
    time-zone: Asia/Seoul             # API 응답 시각 KST (+09:00)

  # docs 5번: 세션·토큰 Redis (gateway·member만 사용)
  data:
    redis:
      host: ${REDIS_SESSION_HOST:localhost}
      port: ${REDIS_SESSION_PORT:6379}
      password: ${REDIS_SESSION_PASSWORD}

  cloud:
    gateway:
      # Spring Cloud Gateway 4.3+ 설정 경로 (구 spring.cloud.gateway.routes 는 deprecated)
      server:
        webflux:
          # docs 7번 gateway 라우팅
          #   Ingress 가 /api 를 떼고 넘긴다 (/api/v1/stores → /v1/stores)
          #   /v*/ 는 버전 숫자와 무관하게 매칭 → v2 가 생겨도 gateway 는 그대로
          #   order 값이 작은 라우트부터 먼저 맞는 것 하나로 간다
          #   /internal/** 는 라우트 없음 → 404 (서비스 간 직접 호출 전용)
          # uri 는 docs 3번 표의 *_SERVICE_URL 로만 받는다 (compose: http://store:8080 등)
          # 기본값은 로컬 VSCode 실행용 포트 (docs 1번 표)
          routes:
            # 사장님 가게 주문 목록 — store 보다 먼저 매칭되어야 함
            - id: order-store-orders
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              order: 1
              predicates:
                - Path=/v*/stores/*/orders/**

            - id: store
              uri: ${STORE_SERVICE_URL:http://localhost:8081}
              order: 2
              predicates:
                - Path=/v*/stores/**,/v*/categories/**

            - id: order
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              order: 3
              predicates:
                - Path=/v*/orders/**,/v*/cart/**

            - id: payment
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
              order: 4
              predicates:
                - Path=/v*/payments/**

            - id: delivery
              uri: ${DELIVERY_SERVICE_URL:http://localhost:8084}
              order: 5
              predicates:
                - Path=/v*/deliveries/**

            - id: member
              uri: ${MEMBER_SERVICE_URL:http://localhost:8085}
              order: 6
              predicates:
                - Path=/v*/auth/**,/v*/members/**

management:
  endpoints:
    web:
      exposure:
        include: health,info          # 후순위: ,prometheus (docs 9-2)
  endpoint:
    health:
      probes:
        enabled: true                 # /actuator/health/liveness, /readiness 활성화
  tracing:
    sampling:
      probability: 1.0                # gateway 가 traceId 를 만들어 하위 서비스로 전파 (docs 6-2)
    # 후순위 (관측성): Zipkin 전송 — starter-zipkin 과 함께 주석 해제 (docs 9-2)
    # export:
    #   zipkin:
    #     endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  structured:
    format:
      console: logstash               # JSON 로그 (docs 6-1)
