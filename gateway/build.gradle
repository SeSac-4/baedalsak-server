// 루트 build.gradle이 Java 21 / Spring Boot BOM / actuator / micrometer-prometheus /
// lombok 을 이미 넣어 준다 (docs 2번).
dependencies {
    // Spring Cloud Gateway. WebFlux(비동기) 기반이므로 spring-boot-starter-web을
    // 같이 넣으면 서블릿 웹서버가 먼저 떠서 라우팅이 동작하지 않는다. 넣지 말 것.
    //
    // 'spring-cloud-starter-gateway'(구 이름)도 같은 걸 받지만,
    // 4.3부터 쓰는 설정 키(spring.cloud.gateway.server.webflux.*)와 이름을 맞춘 쪽을 쓴다.
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

    // docs 5번: 세션 관리용 Redis는 gateway·user만 사용 (WebFlux라 reactive 클라이언트)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.session:spring-session-data-redis'

    // gateway는 DB를 직접 보지 않는다 (docs 4번: 다른 서비스 schema 직접 조회 금지)
}
