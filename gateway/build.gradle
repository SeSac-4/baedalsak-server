// 루트 build.gradle이 Java 21 / Spring Boot BOM / actuator / tracing-brave /
// lombok 을 이미 넣어 준다 (docs 2번).
dependencies {
    // Spring Cloud Gateway. WebFlux(비동기) 기반이므로 spring-boot-starter-webmvc 를
    // 같이 넣으면 서블릿 웹서버가 먼저 떠서 라우팅이 동작하지 않는다. 넣지 말 것.
    //
    // 'spring-cloud-starter-gateway'(구 이름) 대신 설정 키
    // (spring.cloud.gateway.server.webflux.*)와 이름을 맞춘 쪽을 쓴다.
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

    // docs 2·5번: 세션·토큰 Redis 는 gateway·member 만 사용 (WebFlux라 reactive 클라이언트 추가)
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    // gateway는 DB·RabbitMQ를 직접 보지 않는다 (docs 2번: DB·메시지 큐는 gateway 제외 5개)
}
