# delivery 서비스 (배달)
# 환경 변수 이름은 docs/backend-infra-rules.md 3번 표를 그대로 쓴다.
# 로컬 .env -> Kubernetes Secret -> AWS Secrets Manager 까지 이 이름이 이어지므로 바꾸지 말 것.

# [내부] 동기 호출 주소 (docs 3번) — 코드에 하드코딩하지 않는다
#   MEMBER_SERVICE_URL (로컬 기본 http://localhost:8085)
# 외부 API: KAKAO_REST_API_KEY (카카오 로컬 · 모빌리티 REST 키, 🔒 .env 에만). 비어 있으면 카카오 호출을 건너뛴다

server:
  port: ${SERVER_PORT:8084}          # 로컬 VSCode 실행 시 포트 (docs 1번 표). 컨테이너 안에서는 8080
  shutdown: graceful                  # 배포 중 처리 중인 요청을 끝내고 종료 (docs 6-4)

spring:
  application:
    name: delivery
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      pool:
        size: 2                       # 가상 GPS(2초)가 Redis · DB 를 기다리는 동안 outbox 발행(1초)이 멈추지 않게 분리
  datasource:
    # docs 4번: RDS 인스턴스 1개 안에 서비스별 DB (DB 이름 = schema 이름). DB=delivery, 계정=delivery_svc
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:delivery}?currentSchema=${DB_SCHEMA:delivery}
    username: ${DB_USER:delivery_svc}
    password: ${DB_PASSWORD}          # 기본값을 코드에 넣지 않음
    # ## DB 커넥션 풀 (부하 테스트 때 조정) — 지금은 HikariCP 기본값(10) 사용
    #   필요한 수 ≈ 피크 TPS × 쿼리 1건 평균 시간(초) + 여유  (N1.2 50 TPS × 0.05s ≈ 3 → 10 이면 충분)
    #   한도: 모든 서비스의 (파드 수 × maximum-pool-size) 합 < DB max_connections (로컬 postgres 기본 100)
    # hikari:
    #   maximum-pool-size: 10
  flyway:
    schemas: ${DB_SCHEMA:delivery}       # 마이그레이션 대상 = 자기 schema (flyway_schema_history 도 여기)
    default-schema: ${DB_SCHEMA:delivery}
    create-schemas: false             # DB·schema·계정은 초기화 스크립트(로컬) / Terraform(운영)이 만듦
  jpa:
    open-in-view: false               # 트랜잭션이 끝나면 바로 커넥션 반납 (docs 4-2)
    hibernate:
      ddl-auto: validate              # 테이블은 Flyway 만 만듦. 엔티티와 안 맞으면 시작 실패 (docs 4-2)
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul       # KST
  jackson:
    time-zone: Asia/Seoul             # API 응답 시각 KST (+09:00)
  data:
    redis:
      # 캐시 Redis (docs 3번 REDIS_CACHE_*). 라이더 위치처럼 지워져도 다시 채워지는 값만 넣는다 — allkeys-lru
      #   로컬 PC 접속 localhost:6380 (compose redis-cache), 컨테이너 안 redis-cache:6379, AWS 는 인프라가 주입
      #   비밀번호는 아직 Secret 에 없을 수 있어 빈 값 허용 (없으면 인증 없이 접속)
      host: ${REDIS_CACHE_HOST:localhost}
      port: ${REDIS_CACHE_PORT:6380}
      password: ${REDIS_CACHE_PASSWORD:}
      timeout: 1s                     # 위치 조회 · 저장이 Redis 장애로 오래 묶이지 않게
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}       # 로컬 / , 운영 Amazon MQ /prod·/dev
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false} # 로컬 false(5672) / 운영 Amazon MQ true(5671)
    publisher-confirm-type: correlated      # 발행 확인 (docs 3-2)
    publisher-returns: true
    template:
      mandatory: true                       # 받을 큐가 없는 메시지는 버리지 않고 return
      observation-enabled: true             # 발행 시 traceId 를 메시지 헤더에 실음
    listener:
      simple:
        # ## 미리 받아 두는 메시지 수 (부하 테스트 때 조정)
        #   1건 처리가 느릴수록(DB 트랜잭션) 작게, 빠를수록 크게. 파드가 죽으면 이만큼 재전달됨
        prefetch: 10
        observation-enabled: true           # 소비 시 헤더의 traceId 를 이어받음
        default-requeue-rejected: false     # 실패 메시지를 큐에 되돌리지 않음 → DLQ (무한 재처리 방지)
        retry:                              # 앱 안에서 재시도 후 포기 → DLQ
          enabled: true
          max-attempts: 3                   # 최초 1회 + 재시도 2회
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

management:
  health:
    redis:
      # 캐시 Redis 가 없거나 끊겨도 배달 API(수락·픽업·완료)는 동작해야 하므로 readiness 에서 뺀다
      #   (위치만 잠시 안 보이는 것으로 끝나게). 캐시 Redis 배포 후에도 그대로 둔다
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus      # prometheus 추가 (health,info 는 유지)
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true           # HTTP 응답 시간 p95 계산용
  otlp:
    metrics:
      export:
        enabled: false                       # 지표는 Prometheus 가 수집 — OTLP 중복 전송 끔
  logging:
    export:
      otlp:
        enabled: false                       # 로그는 Loki 가 수집 — OTLP 중복 전송 끔

# 배달 메일 (#108, docs 10번). delivery 가 발행한 DeliveryAssigned·PickedUp·Completed 를 자기 메일 큐로 받아 SES 로 동기 발송
#   리스너 규칙(동시성 1 · prefetch 1 · 2초 ×2 재시도)은 RabbitConfig 의 mailListenerContainerFactory 에 있다
#   템플릿은 resources/mail/{이름}.html — 앱이 {{변수}} 를 채우고 <title> 을 메일 제목으로 씀 (SES 는 발송만)
#   local 프로필은 발송 대신 렌더링 결과를 로그로 (docs 10-4). 자격 증명은 두지 않음 — AWS 는 Pod Identity
delivery-mail:
  region: ${AWS_REGION:ap-northeast-2}            # SES 리전 (docs 3번 AWS_REGION, 파드에 없으면 기본값)
  from: no-reply@baedalsak.click                  # 팀 공통 발신 주소 (payment 와 같은 값) — 확정 전 임시값
  templates:
    assigned-customer: delivery-assigned-customer   # 고객 배차완료 메일
    assigned-owner: delivery-assigned-owner         # 사장님 배차완료 메일
    picked-up-customer: delivery-picked-up-customer # 고객 배달시작 메일
    completed-customer: delivery-completed-customer # 고객 배달완료 메일
    completed-owner: delivery-completed-owner       # 사장님 배달완료 메일

# 실시간 위치 (배달실시간초안 2번). 라이더 위치는 캐시 Redis 에, 경로는 DB 에 둔다
#   mode: virtual = 서버가 길찾기 경로를 따라 가상 GPS 를 움직임 / real = 앱이 PUT /v1/deliveries/{id}/location 으로 보냄
#   도착해도 자동 완료하지 않는다 — 라이더가 배달 완료 버튼을 직접 누른다
delivery-gps:
  mode: ${DELIVERY_GPS_MODE:virtual}
  update-interval: 2s               # 가상 GPS 갱신 · 화면 폴링 주기
  speed-kmh: 50                     # 가상 GPS 이동 속도 (도심 오토바이 평균)
  arrival-radius-m: 30              # 배달지까지 이 거리 안이면 도착 플래그
  location-ttl: 30m                 # 위치 키 수명. 완료 시 바로 지우고, 지우지 못해도 이 시간 뒤 사라짐

# 카카오 REST API (주소 → 좌표, 길찾기). 실패하면 빈 값 → 가게와 배달지를 직선으로 잇는다
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}   # 🔒 기본값 없음. 비어 있으면 호출하지 않음
  local-base-url: https://dapi.kakao.com
  mobility-base-url: https://apis-navi.kakaomobility.com
  connect-timeout: 500ms
  read-timeout: 2s
